name: Release
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  release:
    runs-on: ubuntu-24.04
    # A job that hangs (e.g. apt waiting on an unreachable mirror) fails instead of running for the default 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Retry downloads (including failures to resolve the mirror's name), and give up on unresponsive connections.
      - run: |
          APT_OPTIONS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y libgtk-4-dev

      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup.sh
          chmod a+x rustup.sh
          ./rustup.sh -y

      - run: cargo build --locked --release

      - uses: actions/upload-artifact@v4
        with:
          name: vaporeon-x86_64-unknown-linux-gnu
          path: target/release/vaporeon
