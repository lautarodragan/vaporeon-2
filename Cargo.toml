[package]
name = "vaporeon"
description = "Bullet Journal and stuff"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license-file = "LICENSE"
authors = ["Taro"]
categories = ["text-editors", "gui"]
keywords = ["todo", "gtk", "bujo", "organization"]
repository = "https://github.com/lautarodragan/vaporeon-2"

[profile.release]
strip = "debuginfo"
lto = true
codegen-units = 1

[dependencies]
chrono = { version = "0.4.41", features = ["default", "serde"] }
colored = "3.0.0"
flexi_logger = "0.31.2"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
home = "0.5.11"
log = "0.4.27"
pangocairo = "0.22.9"
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.1.2"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
