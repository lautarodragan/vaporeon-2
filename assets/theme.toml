# Copy this file to ~/.config/vaporeon/theme.toml and change whatever you want.
# Any value missing from your file falls back to the one in here.
#
# Colors are "#rrggbb" or "#rrggbbaa".

list_header = "#d79921"
list_entry = "#ebdbb2"
list_decoration = "#975900"
# The color of the bullet of tasks that have details (a description).
list_decoration_details = "#975900"
list_left_line = "#975900"
caret = "#ebdbb2"

background = "#282828"
background_selected = "#3c3836"

# 0.0 = fully transparent, 1.0 = fully opaque.
# Only the background is affected; text is always drawn opaque.
# Your compositor (e.g. Hyprland) may additionally blur whatever is behind the window.
background_opacity = 0.75

# Any Pango font description: "<family> [style] <size>".
# For example "Iosevka Term 14", "JetBrains Mono Bold 12", or just "Monospace 13".
font = "Monospace 13"

# How to tell apart tasks with details (a description) without opening the details panel:
# - "bullet": a different bullet (bullet_with_details). Ideas: "=", "≡", "+", or "-" with another
#   list_decoration_details.
# - "preview": the beginning of the details, dimmed, after the title.
# - "gutter": a dot in the margin, to the left of the bullet (list_decoration_details is its color).
# - "right": a mark (details_marker) at the right end of the row.
# None of them moves the text.
details_indicator = "bullet"
bullet = "-"
bullet_with_details = "="
details_marker = "≡"

# Row height, as a multiple of the font's line height.
line_height = 1.3

# Whether the window should have a title bar / borders drawn by GTK.
# Tiling compositors (Hyprland, Sway, etc.) usually look better without them.
window_decorations = false

# white "#ebdbb2"
# red "#fb4934"
# green "#8ec07c"
# orange d79921
# dark gray 282828
